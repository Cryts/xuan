name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 网页构建用不到 Electron 的二进制（那是一百多 MB 的下载），
      # 跳过它能让 CI 快一大截。打 exe 是在 Windows 上单独跑的。
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 尝试自动开启 Pages（source = GitHub Actions）。
      # 启用 Pages 需要仓库管理员权限，而默认的 GITHUB_TOKEN 没有，
      # 所以这一步可能失败 —— 设成非致命，让后续步骤照常跑。
      # 若仓库尚未开启 Pages，请在 Settings → Pages 把 Source 设为
      # "GitHub Actions"，之后再跑一次本工作流即可。
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # 内容门禁：IP 禁用词、结构、破局通路、曲线连续性
      # 任一 error 即中断，不让违规内容上线
      - name: content-lint
        run: npm run lint:content

      - name: 核心纯度检查
        run: npm run check:core

      - name: 单元测试
        run: npm test

      - name: 构建
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
